[project]
name = "synthetic-portraits"
version = "0.2.0"
description = "Text prompt -> photoreal upper-body image of a person who does not exist (SDXL via ComfyUI on RunPod)."
readme = "README.md"
requires-python = ">=3.11"
# Runtime is zero third-party dependency (stdlib only). Do not add runtime deps.
dependencies = []

[dependency-groups]
# Dev-only: the quality gate. Never imported by runtime code.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]
# Optional: only for running scripts/check_face.py for real (offline, on the host).
# Kept out of `dev` so the CI gate stays light — the face-check tests mock the detector.
# insightface auto-downloads the antelopev2 model pack on first run.
faces = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]

[tool.uv]
# Virtual project: uv does not build/install the package itself; tests import it
# from the source tree via pytest's pythonpath below.
package = false

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
addopts = "-q"
# Registered so a marker can never be silently ignored. Reserved for the spec-to-test
# binding: no checker exists yet, and none is in the gate array (change 0003 design D4).
markers = [
    "spec: binds this test to a spec scenario Key, as `spec(\"<cap>:<req>:<scenario>\")`",
    "spec_exempt: structural test with no scenario to bind, as `spec_exempt(\"<reason>\")`",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D", "ANN"]
# D203/D211 and D212/D213 are mutually exclusive pairs — ruff warns on every run unless
# one of each is disabled. This repo's docstrings are D211 (no blank line before a class)
# and D212 (multi-line summary starting on the first line).
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Tests are named as behavioural sentences and double as documentation, so a docstring
# restating the name is redundant and `-> None` on a test function catches no defect.
# Measured 2026-09-01: D+ANN costs 34 violations across runtime code and 311 in tests.
"tests/**" = ["D1", "D401", "ANN"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["scripts"]

[tool.ty.rules]
# check_face.py's insightface/cv2 imports need `ty: ignore[unresolved-import]` in CI
# (the optional `faces` group isn't installed there); when `faces` IS installed the
# ignore looks unused. Silence that so the gate is clean in both environments.
unused-ignore-comment = "ignore"
