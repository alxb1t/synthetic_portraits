name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The gate is the Makefile's `gate` target. CI runs it rather than keeping
      # its own copy of the commands, which would drift.
      - name: Gate
        run: make gate
