name: build-image

# GPU image published to GHCR (public) so the RunPod pod can pull it in Phases 5-6.
# Rebuilds on every push to main (plus manual dispatch and version tags); buildx gha
# cache keeps unchanged-layer rebuilds cheap.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The cu128 torch + ComfyUI image is ~7 GB; default runners have only ~14 GB
      # free, which fills mid-build and the runner is reaped (job shows "cancelled").
      # Reclaim the preinstalled toolchains we don't use (~25 GB) before building.
      - name: Free disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "after:"; df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Single-platform image; skip the provenance attestation so each build is
          # ONE manifest (no untagged child manifests) — makes the prune below safe.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Keep only the latest image in the registry: after a successful push, delete
      # every older version. Safe because provenance:false makes each build a single
      # manifest, so keeping the newest 1 can never orphan a referenced child manifest.
      - name: Prune old GHCR versions (keep only latest)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 1
