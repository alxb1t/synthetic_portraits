name: build-image

# Built on request only: every image that exists was asked for, and its digest and build
# record are in the run's summary. A pod boots that digest from `gpunit.toml`, never a
# tag, so `latest` is refused rather than published, and no version is ever pruned.
# Actions are pinned by commit SHA. Why: 0006-gpunit-integration design D9.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish — a release candidate, never `latest`
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # A newline in the input would be honoured as a second tag by the action's
      # newline-separated `tags` field. Validate before use, and let the build step
      # read a step output so the raw input is never interpolated into `tags`.
      - name: Resolve and validate the image tag
        id: tag
        env:
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "latest" ]; then
            echo "::error::a pod boots a digest, never 'latest'; name a release candidate."
            exit 1
          fi
          case "$REQUESTED" in
            '' | *[!A-Za-z0-9._-]*)
              echo "::error::tag must match ^[A-Za-z0-9._-]+\$"
              exit 1
              ;;
          esac
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The cu128 torch + ComfyUI image is ~7 GB; default runners have only ~14 GB
      # free, which fills mid-build and the runner is reaped (job shows "cancelled").
      # Reclaim the preinstalled toolchains we don't use (~25 GB) before building.
      - name: Free disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/lib/jvm "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "after:"; df -h /

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/alxb1t/synthetic_portraits:${{ steps.tag.outputs.tag }}
          # One manifest per build, so the digest reported below is the one a pod pulls.
          provenance: false

      # The digest is the pin `config/image.json` and `gpunit.toml` take; the tag is a label.
      - name: Report the digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ghcr.io/alxb1t/synthetic_portraits:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # What the image was built from: `config/image.json`'s `files` must equal it.
      - name: Report the build record
        run: |
          set -euo pipefail
          {
            echo '```json'
            python3 tools/image_record.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
